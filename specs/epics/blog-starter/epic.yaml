# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (BS → BS-1, BS-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: blog-starter
  key: BS
spec:
  title: "Vercel's Next.js Blog Starter on Cloudflare Workers"
  summary: "The Vercel blog-starter template — Markdown posts in `_posts`, statically generated with Next.js — runs unchanged in substance on Cloudflare Workers + Static Assets through @opennextjs/cloudflare, inside the Cirrus baseline's repository conventions (Orun intent and components, credential-free checks, a gated Orun CI, one epic per repository). It is the Cloudflare-only content-site port the coverage analysis ranks first."
  state: started
  milestones:
    - name: "BS0 — the spec"
      exitCriteria:
        - "the doc set and the task contracts are on main"
      tasks: [BS-1]
    - name: "BS1 — the blog on Workers"
      exitCriteria:
        - "apps/web is the upstream template, built by `next build` + `opennextjs-cloudflare build`"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green on main (Checks)"
        - "`wrangler dev` serves the home page and every post from the OpenNext worker"
      tasks: [BS-2]
    - name: "BS2 — ready to instantiate"
      exitCriteria:
        - "the README says how to run, test, preview and deploy it through Orun"
        - "the as-built status records every departure from the upstream template"
      tasks: [BS-3]
    - name: "BS3 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new site from nothing to live on stage and prod in three phases"
        - "a site built from it carries the site only, renamed throughout to its own name, repository and Worker"
        - "Baseline CI is green: contract tests, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier"
      tasks: [BS-4]
